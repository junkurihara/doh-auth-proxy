[package]
name = "doh-auth-proxy"
description = "DNS Proxy for DoH, ODoH and Mutualized ODoH with Authorization"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
edition.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
doh-auth-proxy-lib = { path = "../proxy-lib/", default-features = false, features = [
  "anonymous-token",
] }

anyhow = "1.0.100"
mimalloc = { version = "*", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
derive_builder = "0.20.2"
tokio = { version = "1.49.0", default-features = false, features = [
  "net",
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
  "fs",
] }
async-trait = "0.1.89"

# config
clap = { version = "4.5.54", features = ["std", "cargo", "wrap_help"] }
toml = { version = "0.9.11", default-features = false, features = [
  "parse",
  "serde",
] }
hot_reload = { version = "0.3.5", features = ["file-reloader"] }

# logging
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.22", features = ["chrono", "json"] }

url = "2.5.8"
env-file-reader = "0.3.0"
